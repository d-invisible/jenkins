<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Project 2 Jenkins to Docker Hub architecture</title>
  <desc id="desc">GitHub source triggers Jenkins on a controller. The controller schedules a pipeline on a Docker enabled agent, which builds the Spring Boot application and image and pushes the versioned image to Docker Hub.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172b4d" flood-opacity=".10"/></filter>
    <style>
      .bg{fill:#f5f8fc}.title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#142238}.sub{font:15px Inter,Segoe UI,Arial,sans-serif;fill:#627188}.card{filter:url(#shadow);stroke-width:1.5}.head{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.body{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#40516a}.small{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#6a7890}.tag{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px}.edge{fill:none;stroke:#52627a;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 7}
    </style>
  </defs>
  <rect class="bg" width="1440" height="820" rx="24"/>
  <text x="70" y="75" class="title">Project 2 | Jenkins CI → Docker Hub</text>
  <text x="70" y="106" class="sub">Practice 4 Spring Boot · Gradle build · container image publishing</text>
  <rect x="65" y="150" width="1310" height="505" rx="24" fill="#fff" stroke="#dbe4ef" stroke-width="1.5"/>
  <text x="95" y="188" class="tag" fill="#7990aa">CI ENVIRONMENT · UBUNTU 24.04 EC2</text>
  <rect x="105" y="290" width="195" height="170" rx="18" class="card" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="132" y="331" class="tag" fill="#64748b">SOURCE</text><text x="132" y="365" class="head">GitHub</text>
  <text x="132" y="397" class="body">java-springboot-</text><text x="132" y="418" class="body">gradle-app · main</text>
  <text x="132" y="446" class="small">Gradle app + Dockerfile</text>
  <rect x="375" y="260" width="310" height="230" rx="20" class="card" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="405" y="302" class="tag" fill="#4f46e5">ORCHESTRATION</text><text x="405" y="339" class="head">Jenkins controller</text>
  <text x="405" y="375" class="body">Pipeline job · credentials</text><text x="405" y="400" class="body">Schedules work by agent label</text>
  <rect x="405" y="429" width="246" height="36" rx="9" fill="#fff" stroke="#c7d2fe"/>
  <text x="424" y="452" class="small">dockerhub-creds · username + token</text>
  <rect x="760" y="230" width="365" height="290" rx="20" class="card" fill="#ecfdf5" stroke="#86efac"/>
  <text x="792" y="273" class="tag" fill="#15803d">BUILD + CONTAINER</text><text x="792" y="310" class="head">Jenkins agent</text>
  <text x="792" y="340" class="small">label: jenkins-agent-node-label</text>
  <rect x="792" y="365" width="300" height="43" rx="10" fill="#fff" stroke="#bbf7d0"/>
  <text x="812" y="392" class="body">1  Gradle clean build + archive JAR</text>
  <rect x="792" y="418" width="300" height="43" rx="10" fill="#fff" stroke="#bbf7d0"/>
  <text x="812" y="445" class="body">2  Docker build · tag by build number</text>
  <text x="792" y="488" class="small">Java 21 · Git · Docker Engine · SSH 22</text>
  <rect x="1190" y="290" width="155" height="170" rx="18" class="card" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1215" y="331" class="tag" fill="#c2410c">REGISTRY</text><text x="1215" y="367" class="head">Docker Hub</text>
  <text x="1215" y="402" class="body">my-app</text><text x="1215" y="426" class="body">:BUILD_NUMBER</text>
  <text x="1215" y="448" class="small">versioned image</text>
  <path d="M300 365 H365" class="edge dash"/><text x="310" y="346" class="small">Webhook trigger</text>
  <path d="M300 305 H335 V215 H740 V300" class="edge"/><text x="475" y="210" class="small">HTTPS · source checkout on agent</text>
  <path d="M685 365 H750" class="edge"/><text x="687" y="346" class="small">SSH / remoting</text>
  <path d="M1125 365 H1180" class="edge"/><text x="1128" y="346" class="small">HTTPS · push</text>
  <rect x="95" y="565" width="1250" height="58" rx="14" fill="#f8fafc" stroke="#dbe4ef"/>
  <text x="125" y="600" class="tag" fill="#52627a">PIPELINE</text>
  <text x="245" y="601" class="body">Checkout → Build and test → Archive JAR → Docker build → Login → Tag → Push → Logout</text>
  <text x="70" y="705" class="small">Image destination: DOCKER_USER/my-app:BUILD_NUMBER  ·  Docker daemon runs on the dedicated build agent</text>
</svg>
